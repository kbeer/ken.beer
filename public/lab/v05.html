<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Architecture · ken.beer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #faf9f7;
      --bg-1:     #f4f3f0;
      --bg-2:     #eeedea;
      --bg-3:     #e8e7e3;
      --text:     #1a1a18;
      --text-2:   #6b6960;
      --text-3:   #9e9a8f;
      --border:   #ddd9d0;
      --border-2: #d8d5cd;
      --border-3: #c8c4ba;
      --serif:    'Instrument Serif', serif;
      --sans:     'IBM Plex Sans', sans-serif;
      --mono:     'IBM Plex Mono', monospace;
    }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      font-weight: 300;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* ── Sticky Overview ───────────────────────────────────────────── */

    .overview {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(250, 249, 247, 0.93);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .overview-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 32px 16px;
    }

    .breadcrumb {
      font-family: var(--mono);
      font-weight: 300;
      font-size: 11px;
      color: var(--text-3);
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .overview-head {
      display: flex;
      align-items: flex-start;
      gap: 24px;
    }

    .overview-left {
      flex: 0 0 auto;
    }

    .overview-title {
      font-family: var(--serif);
      font-size: 21px;
      font-weight: 400;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .overview-intro {
      font-size: 13px;
      color: var(--text-2);
      font-weight: 300;
      line-height: 1.5;
      max-width: 320px;
    }

    .overview-diagram {
      flex: 1 1 auto;
      min-width: 0;
    }

    .overview-diagram svg {
      display: block;
      width: 100%;
      max-height: 90px;
    }

    /* ── Main Content ──────────────────────────────────────────────── */

    .main {
      max-width: 900px;
      margin: 0 auto;
      padding: 28px 32px 80px;
    }

    /* ── Controls ─────────────────────────────────────────────────── */

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .btn {
      font-family: var(--mono);
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.03em;
      padding: 5px 12px;
      border: 1px solid var(--border-2);
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
      transition: background 0.1s;
    }

    .btn:hover {
      background: var(--bg-1);
      color: var(--text);
    }

    /* ── Section ──────────────────────────────────────────────────── */

    .arch-section {
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 18px 22px;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }

    .section-header:hover {
      background: var(--bg-1);
    }

    .section-thumb {
      flex: 0 0 130px;
      width: 130px;
    }

    .section-thumb svg {
      display: block;
      width: 130px;
    }

    .section-meta {
      flex: 1 1 auto;
      min-width: 0;
    }

    .section-title-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 4px;
    }

    .section-title {
      font-family: var(--serif);
      font-size: 19px;
      font-weight: 400;
      color: var(--text);
    }

    .section-desc {
      font-size: 13px;
      color: var(--text-2);
      font-weight: 300;
      line-height: 1.5;
    }

    .section-chevron {
      flex: 0 0 auto;
      font-family: var(--mono);
      font-size: 14px;
      color: var(--text-3);
      transition: transform 0.15s;
    }

    .section-chevron.open {
      transform: rotate(180deg);
    }

    /* ── Section Children ─────────────────────────────────────────── */

    .section-children {
      display: none;
      padding: 0 22px 22px;
      background: var(--bg-1);
      border-top: 1px solid var(--border);
    }

    .section-children.open {
      display: block;
    }

    .children-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 8px;
      padding-top: 14px;
    }

    /* ── Node Card ────────────────────────────────────────────────── */

    .node-card {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 12px 14px;
    }

    .node-card.has-children {
      cursor: pointer;
    }

    .node-card.has-children:hover {
      background: var(--bg-1);
    }

    .node-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .node-title {
      font-family: var(--mono);
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 0.02em;
      color: var(--text);
      line-height: 1.4;
    }

    .node-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .node-chevron {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-3);
      transition: transform 0.12s;
    }

    .node-chevron.open {
      transform: rotate(180deg);
    }

    /* ── Status Dot ───────────────────────────────────────────────── */

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-mapped  { background: var(--text); }
    .dot-partial { background: var(--text-3); }
    .dot-cloud   { background: transparent; border: 1.5px solid var(--text-3); }

    /* ── Info Button ──────────────────────────────────────────────── */

    .info-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      font-family: var(--mono);
      font-weight: 300;
      font-size: 9px;
      color: var(--text-3);
      border: 1px solid var(--border-2);
      background: transparent;
      cursor: pointer;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.1s, border-color 0.1s;
    }

    .info-btn:hover {
      color: var(--text);
      border-color: var(--text);
    }

    /* ── Sub-children ─────────────────────────────────────────────── */

    .node-sub {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .node-sub.open {
      display: block;
    }

    .sub-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }

    .sub-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 7px 9px;
      background: var(--bg-2);
      border: 1px solid var(--border-2);
    }

    .sub-title {
      font-family: var(--mono);
      font-weight: 300;
      font-size: 11px;
      color: var(--text);
      line-height: 1.3;
    }

    .sub-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    /* ── Info Overlay ─────────────────────────────────────────────── */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: rgba(26, 26, 24, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .overlay.hidden { display: none; }

    .overlay-card {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 28px 28px 24px;
      max-width: 400px;
      width: 100%;
      position: relative;
    }

    .overlay-close {
      position: absolute;
      top: 14px;
      right: 14px;
      font-family: var(--mono);
      font-weight: 300;
      font-size: 10px;
      color: var(--text-3);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      letter-spacing: 0.04em;
    }

    .overlay-close:hover { color: var(--text); }

    .overlay-title {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 400;
      color: var(--text);
      margin-bottom: 12px;
      line-height: 1.25;
    }

    .overlay-desc {
      font-family: var(--sans);
      font-weight: 300;
      font-size: 14px;
      color: var(--text-2);
      line-height: 1.65;
    }

    /* ── Footer ───────────────────────────────────────────────────── */

    footer {
      text-align: center;
      padding: 28px 32px;
      font-family: var(--mono);
      font-weight: 300;
      font-size: 11px;
      color: var(--text-3);
      letter-spacing: 0.04em;
      border-top: 1px solid var(--border);
    }

    /* ── Responsive ───────────────────────────────────────────────── */

    @media (max-width: 600px) {
      .overview-inner { padding: 12px 16px 14px; }
      .overview-head  { flex-direction: column; gap: 12px; }
      .overview-intro { max-width: none; }
      .main           { padding: 20px 16px 60px; }
      .section-header { padding: 14px 16px; gap: 14px; }
      .section-thumb  { flex: 0 0 100px; width: 100px; }
      .section-thumb svg { width: 100px; }
      .section-children { padding: 0 16px 16px; }
      .children-grid  { grid-template-columns: 1fr; }
      .sub-grid       { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ── Sticky Overview ─────────────────────────────────────────────────── -->
  <div class="overview">
    <div class="overview-inner">
      <div class="breadcrumb">Glide › Architecture</div>
      <div class="overview-head">
        <div class="overview-left">
          <h1 class="overview-title">The Architecture</h1>
          <p class="overview-intro">Four components. Inputs flow through the orchestrator to surfaces. Everything sits on local-first substrate.</p>
        </div>
        <div class="overview-diagram" id="overview-svg"></div>
      </div>
    </div>
  </div>

  <!-- ── Main ────────────────────────────────────────────────────────────── -->
  <main class="main">
    <div class="controls">
      <button class="btn" id="expand-all">expand all</button>
      <button class="btn" id="collapse-all">collapse all</button>
    </div>
    <div id="sections"></div>
  </main>

  <!-- ── Info Overlay ─────────────────────────────────────────────────────  -->
  <div class="overlay hidden" id="overlay">
    <div class="overlay-card">
      <button class="overlay-close" id="overlay-close">close</button>
      <div class="overlay-title" id="overlay-title"></div>
      <div class="overlay-desc"  id="overlay-desc"></div>
    </div>
  </div>

  <footer>v05 · ken.beer/lab</footer>

<script>
'use strict';

// ── Data ──────────────────────────────────────────────────────────────────────

const DESC = {
  'inputs':               'Everything that flows into GlideOS. Structured intentions, ambient data, external services.',
  'purpose-tree':         'Hierarchical goal structure. Every task traces back to a life objective.',
  'do-jobber':            'The Day Planner of Sisyphus. Walks the Purpose Tree with contextual weights — energy, location, time — to surface the highest-ROI action right now.',
  'digital-exhaust':      'Ambient behavioral data. The residue of activity across apps and devices.',
  'sensors':              'Physical and environmental inputs. Location, biometrics, context signals.',
  'services':             'External APIs and integrations that feed data into the system.',
  'kentext':              'Personal text corpus and writing context. The linguistic fingerprint.',
  'glideos':              'The orchestration layer. Takes inputs, applies Credo personality, distributes through Frenula to surfaces.',
  'credo':                'The personality layer. Five modes that shape how GlideOS communicates and decides.',
  'chill-steward':        'Low-key, maintenance-focused mode. Keeps things running without drama.',
  'flash':                'High-energy, sprint mode. For bursts of focused output.',
  'family-conductor':     'Coordination mode for family and household context.',
  'professional-captain': 'Formal, output-oriented mode for professional work.',
  'privacy-monk':         'Minimal footprint mode. Reduces data exposure and external calls.',
  'glide-stack':          'Eight layers from raw input to lived experience.',
  'l0-intentional-input': 'Raw structured input from the user.',
  'l1-sensing':           'Ambient data collection and signal detection.',
  'l2-data-substrate':    'Storage and retrieval layer.',
  'l3-orchestration':     'Task routing and workflow management.',
  'l4-presentation':      'Formatting and rendering layer.',
  'l5-distribution':      'Delivery to surfaces and channels.',
  'l6-surfaces':          'Interaction surfaces: devices, apps, interfaces.',
  'l7-experience':        'The lived moment of interaction.',
  'membrane':             'The boundary between GlideOS and the outside world. Controls what gets in and out.',
  'frenula':              'Physical surfaces where GlideOS meets the world. Latin: little bridle — communication to the horse, not coercion.',
  'liminality-spectrum':  'How aware the user is of GlideOS acting. From subliminal (invisible) to explicit (requires attention).',
  'subliminal':           'GlideOS acts without the user noticing. Fully invisible.',
  'liminal':              'At the edge of awareness. Subtle nudges and ambient signals.',
  'explicit':             'Requires user attention and decision.',
  'phase-shift':          'Transition between modes. The moment of context switching.',
  'archetypes':           'Behavioral patterns that shape interaction style across Frenula surfaces.',
  'devices':              'Physical hardware endpoints: phone, watch, desktop, ambient displays.',
  'intercom':             'Voice and conversational interface layer.',
  'bridge':               'Cross-system integration and translation layer.',
  'grammars':             'Interaction language rules for each surface type.',
  'substrate':            'The physical and digital infrastructure everything runs on. Local-first by design.',
  'mac-mini':             'Primary local compute node. Always-on home server.',
  'git':                  'Version control and history substrate.',
  'workflowy':            'Hierarchical notes and task structure.',
  'obsidian':             'Long-form knowledge base and second brain.',
  'kentaculus':           'Personal tooling and automation scripts.',
  'kujo':                 'Cloud backup and sync layer. Planned.',
};

const SECTIONS = [
  {
    id: 'inputs', title: 'Inputs',
    children: [
      { id: 'purpose-tree',    title: 'Purpose Tree',    status: 'mapped'  },
      { id: 'do-jobber',       title: 'Do-Jobber',       status: 'mapped'  },
      { id: 'digital-exhaust', title: 'Digital Exhaust', status: 'partial' },
      { id: 'sensors',         title: 'Sensors',         status: 'cloud'   },
      { id: 'services',        title: 'Services',        status: 'partial' },
      { id: 'kentext',         title: 'Kentext',         status: 'cloud'   },
    ],
  },
  {
    id: 'glideos', title: 'GlideOS',
    children: [
      {
        id: 'credo', title: 'Credo', status: 'mapped',
        children: [
          { id: 'chill-steward',        title: 'Chill Steward',        status: 'mapped' },
          { id: 'flash',                title: 'Flash',                status: 'mapped' },
          { id: 'family-conductor',     title: 'Family Conductor',     status: 'mapped' },
          { id: 'professional-captain', title: 'Professional Captain', status: 'mapped' },
          { id: 'privacy-monk',         title: 'Privacy Monk',         status: 'mapped' },
        ],
      },
      {
        id: 'glide-stack', title: 'Glide Stack', status: 'mapped',
        children: [
          { id: 'l0-intentional-input', title: 'L0 Intentional Input', status: 'mapped' },
          { id: 'l1-sensing',           title: 'L1 Sensing',           status: 'mapped' },
          { id: 'l2-data-substrate',    title: 'L2 Data Substrate',    status: 'mapped' },
          { id: 'l3-orchestration',     title: 'L3 Orchestration',     status: 'mapped' },
          { id: 'l4-presentation',      title: 'L4 Presentation',      status: 'mapped' },
          { id: 'l5-distribution',      title: 'L5 Distribution',      status: 'mapped' },
          { id: 'l6-surfaces',          title: 'L6 Surfaces',          status: 'mapped' },
          { id: 'l7-experience',        title: 'L7 Experience',        status: 'mapped' },
        ],
      },
      { id: 'membrane', title: 'Membrane', status: 'partial' },
    ],
  },
  {
    id: 'frenula', title: 'Frenula',
    children: [
      {
        id: 'liminality-spectrum', title: 'Liminality Spectrum', status: 'mapped',
        children: [
          { id: 'subliminal',  title: 'Subliminal',  status: 'mapped' },
          { id: 'liminal',     title: 'Liminal',     status: 'mapped' },
          { id: 'explicit',    title: 'Explicit',    status: 'mapped' },
          { id: 'phase-shift', title: 'Phase Shift', status: 'mapped' },
        ],
      },
      { id: 'archetypes', title: 'Archetypes', status: 'partial' },
      { id: 'devices',    title: 'Devices',    status: 'partial' },
      { id: 'intercom',   title: 'Intercom',   status: 'cloud'   },
      { id: 'bridge',     title: 'Bridge',     status: 'cloud'   },
      { id: 'grammars',   title: 'Grammars',   status: 'cloud'   },
    ],
  },
  {
    id: 'substrate', title: 'Substrate',
    children: [
      { id: 'mac-mini',    title: 'Mac Mini',    status: 'mapped' },
      { id: 'git',         title: 'Git',         status: 'mapped' },
      { id: 'workflowy',   title: 'WorkFlowy',   status: 'mapped' },
      { id: 'obsidian',    title: 'Obsidian',    status: 'mapped' },
      { id: 'kentaculus',  title: 'Kentaculus',  status: 'mapped' },
      { id: 'kujo',        title: 'Kujo',        status: 'cloud'  },
    ],
  },
];

// ── SVG Diagram ───────────────────────────────────────────────────────────────

// Diagram layout constants
const NODES = [
  { id: 'inputs',    label: 'Inputs',    x: 14,  y: 40, w: 88, h: 30 },
  { id: 'glideos',   label: 'GlideOS',   x: 152, y: 40, w: 96, h: 30 },
  { id: 'frenula',   label: 'Frenula',   x: 300, y: 40, w: 88, h: 30 },
  { id: 'substrate', label: 'Substrate', x: 152, y: 90, w: 96, h: 30 },
];

// Pre-calculate connection line endpoints
const LINES = [
  { x1: 102, y1: 55, x2: 152, y2: 55 },  // Inputs → GlideOS
  { x1: 248, y1: 55, x2: 300, y2: 55 },  // GlideOS → Frenula
  { x1: 200, y1: 70, x2: 200, y2: 90 },  // GlideOS ↓ Substrate
];

function makeDiagramSVG(highlight) {
  const W = 402, H = 132;

  const linesHTML = LINES.map(l =>
    `<line x1="${l.x1}" y1="${l.y1}" x2="${l.x2}" y2="${l.y2}" stroke="#c8c4ba" stroke-width="1"/>`
  ).join('');

  const nodesHTML = NODES.map(n => {
    const hl     = n.id === highlight;
    const fill   = hl ? '#1a1a18' : 'none';
    const stroke = hl ? '#1a1a18' : '#c8c4ba';
    const color  = hl ? '#faf9f7' : '#1a1a18';
    const cx     = n.x + n.w / 2;
    const cy     = n.y + n.h / 2 + 3.5; // +3.5 for vertical centering of text baseline
    return `<g>
      <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="1" fill="${fill}" stroke="${stroke}" stroke-width="1"/>
      <text x="${cx}" y="${cy}" text-anchor="middle" fill="${color}" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="300" letter-spacing="0.02em">${n.label}</text>
    </g>`;
  }).join('');

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Architecture diagram">
  ${linesHTML}
  ${nodesHTML}
</svg>`;
}

// ── HTML Builders ─────────────────────────────────────────────────────────────

function dot(status) {
  return `<span class="dot dot-${status}" aria-label="${status}"></span>`;
}

function infoBtn(id) {
  if (!DESC[id]) return '';
  return `<button class="info-btn" data-info="${id}" aria-label="Info about ${id}">i</button>`;
}

function buildSubGrid(children) {
  return `<div class="node-sub">
    <div class="sub-grid">
      ${children.map(c => `
        <div class="sub-item">
          <span class="sub-title">${c.title}</span>
          <div class="sub-actions">${dot(c.status)}${infoBtn(c.id)}</div>
        </div>`).join('')}
    </div>
  </div>`;
}

function buildNodeCard(node) {
  const hasSub = Array.isArray(node.children) && node.children.length > 0;
  return `<div class="node-card${hasSub ? ' has-children' : ''}" data-node="${node.id}">
    <div class="node-header">
      <span class="node-title">${node.title}</span>
      <div class="node-actions">
        ${dot(node.status)}
        ${infoBtn(node.id)}
        ${hasSub ? `<span class="node-chevron" aria-hidden="true">▾</span>` : ''}
      </div>
    </div>
    ${hasSub ? buildSubGrid(node.children) : ''}
  </div>`;
}

function buildSection(s) {
  return `<div class="arch-section" data-section="${s.id}">
    <div class="section-header" data-toggle="${s.id}">
      <div class="section-thumb">${makeDiagramSVG(s.id)}</div>
      <div class="section-meta">
        <div class="section-title-row">
          <h2 class="section-title">${s.title}</h2>
        </div>
        ${DESC[s.id] ? `<p class="section-desc">${DESC[s.id]}</p>` : ''}
      </div>
      <span class="section-chevron" aria-hidden="true">▾</span>
    </div>
    <div class="section-children" data-children="${s.id}">
      <div class="children-grid">
        ${s.children.map(buildNodeCard).join('')}
      </div>
    </div>
  </div>`;
}

// ── Render ────────────────────────────────────────────────────────────────────

document.getElementById('overview-svg').innerHTML = makeDiagramSVG(null);
document.getElementById('sections').innerHTML = SECTIONS.map(buildSection).join('');

// ── Interaction ───────────────────────────────────────────────────────────────

// Section expand/collapse
document.querySelectorAll('.section-header').forEach(hdr => {
  hdr.addEventListener('click', () => {
    const id  = hdr.dataset.toggle;
    const children  = document.querySelector(`[data-children="${id}"]`);
    const chevron   = hdr.querySelector('.section-chevron');
    const isOpen    = children.classList.contains('open');
    children.classList.toggle('open', !isOpen);
    chevron.classList.toggle('open', !isOpen);
  });
});

// Node expand/collapse (for nodes with sub-children)
document.querySelectorAll('.node-card.has-children').forEach(card => {
  card.addEventListener('click', e => {
    if (e.target.closest('.info-btn')) return;
    const sub     = card.querySelector('.node-sub');
    const chevron = card.querySelector('.node-chevron');
    const isOpen  = sub.classList.contains('open');
    sub.classList.toggle('open', !isOpen);
    if (chevron) chevron.classList.toggle('open', !isOpen);
  });
});

// Expand All
document.getElementById('expand-all').addEventListener('click', () => {
  document.querySelectorAll('.section-children').forEach(el => el.classList.add('open'));
  document.querySelectorAll('.section-chevron').forEach(el => el.classList.add('open'));
  document.querySelectorAll('.node-sub').forEach(el => el.classList.add('open'));
  document.querySelectorAll('.node-chevron').forEach(el => el.classList.add('open'));
});

// Collapse All
document.getElementById('collapse-all').addEventListener('click', () => {
  document.querySelectorAll('.section-children').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('.section-chevron').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('.node-sub').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('.node-chevron').forEach(el => el.classList.remove('open'));
});

// Info overlay
const overlay      = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayDesc  = document.getElementById('overlay-desc');

function openOverlay(id) {
  const desc = DESC[id];
  if (!desc) return;
  // Find the node's display title
  const nodeEl = document.querySelector(`[data-node="${id}"] .node-title`)
    || document.querySelector(`.sub-item [data-info="${id}"]`)?.closest('.sub-item')?.querySelector('.sub-title');
  const title = nodeEl ? nodeEl.textContent : id;
  overlayTitle.textContent = title;
  overlayDesc.textContent  = desc;
  overlay.classList.remove('hidden');
}

function closeOverlay() {
  overlay.classList.add('hidden');
}

// Delegate info button clicks across whole document
document.addEventListener('click', e => {
  const btn = e.target.closest('.info-btn');
  if (btn) {
    e.stopPropagation();
    openOverlay(btn.dataset.info);
    return;
  }
  // Click outside overlay card closes it
  if (e.target === overlay) closeOverlay();
});

document.getElementById('overlay-close').addEventListener('click', closeOverlay);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeOverlay();
});
</script>
</body>
</html>
